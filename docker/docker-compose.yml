services:
  postgres:
    image: postgres:16
    container_name: indiehost-postgres
    restart: always
    environment:
      POSTGRES_USER: indiehost
      POSTGRES_PASSWORD: indiehost_dev_password
      POSTGRES_DB: indiehost_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: indiehost-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@indiehost.fr
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  postgres_data:
