services:
  preflight:
    image: alpine:3.20
    restart: "no"
    env_file: .env
    environment:
      STRICT_EXTERNAL_CONFIG: ${STRICT_EXTERNAL_CONFIG:-true}
    volumes:
      - ./scripts/docker/preflight.sh:/preflight.sh:ro
      - ./secrets:/secrets:ro
    command: ["/bin/sh", "-ec", "tr -d '\\r' < /preflight.sh > /tmp/preflight.sh && /bin/sh /tmp/preflight.sh"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend/api
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: .env
    secrets:
      - database_url
      - stripe_secret_key
      - clerk_secret_key
      - imagekit_api_key
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      CLERK_SECRET_KEY_FILE: /run/secrets/clerk_secret_key
      IMAGEKIT_API_KEY_FILE: /run/secrets/imagekit_api_key
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  scraping:
    build:
      context: ./backend/microservices/microservice-scraping-py
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      SCRAPFLY_KEY: ${SCRAPFLY_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DONATION_LINK: ${VITE_DONATION_LINK:-}
        VITE_LISTINGS_DATA_MODE: ${VITE_LISTINGS_DATA_MODE:-api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_REQUEST_TIMEOUT_MS: ${VITE_API_REQUEST_TIMEOUT_MS:-20000}
        VITE_BOOKINGS_API_BASE_URL: ${VITE_BOOKINGS_API_BASE_URL:-/api/v1}
        VITE_BOOKINGS_PATH: ${VITE_BOOKINGS_PATH:-/bookings}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_IN_DEV_UTILITIES_ENABLED: ${VITE_IN_DEV_UTILITIES_ENABLED:-false}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_STRIPE_API_BASE_URL: ${VITE_STRIPE_API_BASE_URL:-/api/v1}
        VITE_STRIPE_PAYMENT_INTENT_PATH: ${VITE_STRIPE_PAYMENT_INTENT_PATH:-/payments/stripe/payment-intents}
        VITE_STRIPE_PAYMENT_RETURN_URL: ${VITE_STRIPE_PAYMENT_RETURN_URL:-http://localhost}
        VITE_STRIPE_CHECKOUT_OFFLINE_MODE: ${VITE_STRIPE_CHECKOUT_OFFLINE_MODE:-false}
        VITE_GANDI_API_BASE_URL: ${VITE_GANDI_API_BASE_URL:-/api/v1}
        VITE_GANDI_AVAILABILITY_PATH: ${VITE_GANDI_AVAILABILITY_PATH:-/domains/grandi/availability}
        VITE_GANDI_CHECKOUT_PATH: ${VITE_GANDI_CHECKOUT_PATH:-/domains/grandi/checkout}
        VITE_IMAGEKIT_ENDPOINT: ${VITE_IMAGEKIT_ENDPOINT:-}
        VITE_IMAGEKIT_UPLOAD_PATH: ${VITE_IMAGEKIT_UPLOAD_PATH:-/medias/imagekit/upload}
        VITE_IMAGEKIT_IMPORT_PATH: ${VITE_IMAGEKIT_IMPORT_PATH:-/medias/imagekit/import}
        VITE_PUBLIC_LISTING_ROOT_DOMAIN: ${VITE_PUBLIC_LISTING_ROOT_DOMAIN:-localhost}
        VITE_SCRAPING_API_URL: ${VITE_SCRAPING_API_URL:-/scraping}
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && test -s /usr/share/nginx/html/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: indiehost-nginx
    restart: unless-stopped
    env_file: .env
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN}
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      scraping:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    command:
      - /bin/sh
      - -ec
      - |
        (
          while :; do
            sleep 12h
            nginx -s reload || true
          done
        ) &
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  certbot:
    image: certbot/dns-cloudflare:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./secrets/cloudflare.ini:/run/secrets/cloudflare.ini:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        trap exit TERM
        while :; do
          certbot renew \
            --non-interactive \
            --quiet \
            --dns-cloudflare \
            --dns-cloudflare-credentials /run/secrets/cloudflare.ini \
            --dns-cloudflare-propagation-seconds ${CLOUDFLARE_DNS_PROPAGATION_SECONDS:-30} || true
          sleep 12h
        done

volumes:
  postgres_data:

secrets:
  database_url:
    file: ./secrets/database_url.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  clerk_secret_key:
    file: ./secrets/clerk_secret_key.txt
  imagekit_api_key:
    file: ./secrets/imagekit_api_key.txt
