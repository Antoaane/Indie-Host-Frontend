version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    secrets:
      - database_url
      - stripe_secret_key
      - clerk_secret_key
      - gandi_api_token
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      CLERK_SECRET_KEY_FILE: /run/secrets/clerk_secret_key
      GANDI_API_TOKEN_FILE: /run/secrets/gandi_api_token
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DONATION_LINK: ${VITE_DONATION_LINK:-}
        VITE_LISTINGS_DATA_MODE: ${VITE_LISTINGS_DATA_MODE:-api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_REQUEST_TIMEOUT_MS: ${VITE_API_REQUEST_TIMEOUT_MS:-20000}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_IN_DEV_UTILITIES_ENABLED: ${VITE_IN_DEV_UTILITIES_ENABLED:-false}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_STRIPE_API_BASE_URL: ${VITE_STRIPE_API_BASE_URL:-/api/v1}
        VITE_STRIPE_PAYMENT_INTENT_PATH: ${VITE_STRIPE_PAYMENT_INTENT_PATH:-/payments/stripe/payment-intents}
        VITE_STRIPE_PAYMENT_RETURN_URL: ${VITE_STRIPE_PAYMENT_RETURN_URL:-http://localhost}
        VITE_STRIPE_CHECKOUT_OFFLINE_MODE: ${VITE_STRIPE_CHECKOUT_OFFLINE_MODE:-false}
        VITE_IMAGEKIT_ENDPOINT: ${VITE_IMAGEKIT_ENDPOINT:-}
        VITE_PUBLIC_LISTING_ROOT_DOMAIN: ${VITE_PUBLIC_LISTING_ROOT_DOMAIN:-localhost}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: indiehost-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:

secrets:
  database_url:
    file: ./secrets/database_url.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  clerk_secret_key:
    file: ./secrets/clerk_secret_key.txt
  gandi_api_token:
    file: ./secrets/gandi_api_token.txt
