# Routage commun à tous les hôtes servis par nginx (indiehost.fr, *.indiehost.fr, domaines personnalisés).
# Inclus dans chaque bloc `server` HTTPS de nginx.conf.template.

# En-têtes de sécurité communs (hérités par les `location` ci-dessous tant qu'elles ne déclarent
# aucun `add_header`). HSTS est posé dans nginx.conf.template, uniquement pour ${SSL_DOMAIN}.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
# CSP complète en mode rapport seul : les violations apparaissent dans la console du navigateur
# (aucun report-uri), rien n'est bloqué. À passer en `Content-Security-Policy` une fois les
# parcours Clerk, Stripe, hCaptcha, ImageKit et Google Maps vérifiés sans violation.
# Le hash sha256 autorise le script en ligne de frontend/index.html qui pose `html.is-booting`
# (écran de chargement du tableau de bord) : le recalculer à chaque modification de ce script
# (`node scripts/csp-inline-script-hash.js` à la racine du dépôt).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-a4NJuzBwiHcAWWgIdtkxyHKUHKwMgBH1uHZb3VEIEyk=' https://clerk.indiehost.fr https://*.clerk.accounts.dev https://js.stripe.com https://js.hcaptcha.com https://*.hcaptcha.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://clerk.indiehost.fr https://*.clerk.accounts.dev https://api.stripe.com https://m.stripe.network https://m.stripe.com https://r.stripe.com https://*.hcaptcha.com https://ik.imagekit.io https://upload.imagekit.io; frame-src https://clerk.indiehost.fr https://*.clerk.accounts.dev https://js.stripe.com https://hooks.stripe.com https://*.hcaptcha.com https://challenges.cloudflare.com https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://checkout.stripe.com https://connect.stripe.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

location = /api {
    return 301 /api/;
}

location /api/ {
    # Vidéos d'annonce envoyées en binaire à l'API (150 Mo max côté API) : pas de tampon disque, délais allongés.
    client_max_body_size 160m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Écrasés ici pour que le client ne puisse pas les fixer (liens absolus construits par l'API).
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Le microservice de scraping n'est plus exposé : l'import passe par POST /api/v1/imports/scrape.

location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
