# Routage commun à tous les hôtes servis par nginx (indiehost.fr, *.indiehost.fr, domaines personnalisés).
# Inclus dans chaque bloc `server` HTTPS de nginx.conf.template.

# En-têtes de sécurité communs (hérités par les `location` ci-dessous tant qu'elles ne déclarent
# aucun `add_header`). HSTS est posé dans nginx.conf.template, uniquement pour ${SSL_DOMAIN}.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
# CSP complète en mode rapport seul : les violations apparaissent dans la console du navigateur
# (aucun report-uri), rien n'est bloqué. À passer en `Content-Security-Policy` une fois les
# parcours Clerk, Stripe, hCaptcha, ImageKit, carte OpenFreeMap (annonce) et Google Maps (éditeur)
# vérifiés sans violation.
# Le hash sha256 autorise le script en ligne de frontend/index.html qui pose `html.is-booting`
# (écran de chargement du tableau de bord) : le recalculer à chaque modification de ce script
# (`node scripts/csp-inline-script-hash.js` à la racine du dépôt).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-a4NJuzBwiHcAWWgIdtkxyHKUHKwMgBH1uHZb3VEIEyk=' https://clerk.indiehost.fr https://*.clerk.accounts.dev https://js.stripe.com https://js.hcaptcha.com https://*.hcaptcha.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://clerk.indiehost.fr https://*.clerk.accounts.dev https://api.stripe.com https://m.stripe.network https://m.stripe.com https://r.stripe.com https://*.hcaptcha.com https://ik.imagekit.io https://upload.imagekit.io https://tiles.openfreemap.org; frame-src https://clerk.indiehost.fr https://*.clerk.accounts.dev https://js.stripe.com https://hooks.stripe.com https://*.hcaptcha.com https://challenges.cloudflare.com https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://checkout.stripe.com https://connect.stripe.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

location = /api {
    return 301 /api/;
}

location /api/ {
    # Vidéos d'annonce envoyées en binaire à l'API (150 Mo max côté API) : pas de tampon disque, délais allongés.
    client_max_body_size 160m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Écrasés ici pour que le client ne puisse pas les fixer (liens absolus construits par l'API).
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Le microservice de scraping n'est plus exposé : l'import passe par POST /api/v1/imports/scrape.

# Shell vierge du site, lu par l'API pour servir les sites d'hôtes : jamais servi au public.
location = /__shell.html {
    return 404;
}

location / {
    # Pages des sites d'hôtes (et adresses d'annonce sur indiehost.fr) : d'abord l'API, qui sert le
    # HTML déjà rempli ou une redirection 301 (règle : les `map` de nginx.conf.template).
    # `recursive_error_pages` : sans lui, nginx n'applique qu'un `error_page` par requête, et le repli
    # de @public_site vers le site (API injoignable) ne se ferait jamais.
    recursive_error_pages on;
    error_page 418 = @public_site;
    if ($ih_public_site) {
        return 418;
    }

    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @public_site {
    set $ih_public_site_uri /v1/public-site/page;
    proxy_pass http://ih_api$ih_public_site_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # API injoignable ou trop lente : la page du site Vue, comme avant, sans faire attendre le visiteur.
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @frontend;
}

location @frontend {
    proxy_pass http://ih_frontend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# L'API répond « délégué » par `X-Accel-Redirect: /__frontend/<chemin>` (guide d'arrivée, pages
# légales, domaine inconnu…) : nginx sert alors la page du site Vue, comme avant.
location ^~ /__frontend/ {
    internal;
    rewrite ^/__frontend(/.*)$ $1 break;
    proxy_pass http://ih_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
