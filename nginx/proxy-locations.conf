# Routage commun à tous les hôtes servis par nginx (indiehost.fr, *.indiehost.fr, domaines personnalisés).
# Inclus dans chaque bloc `server` HTTPS de nginx.conf.template.

# En-têtes de sécurité communs (hérités par les `location` ci-dessous tant qu'elles ne déclarent
# aucun `add_header`). HSTS est posé dans nginx.conf.template, uniquement pour ${SSL_DOMAIN}.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

location = /api {
    return 301 /api/;
}

location /api/ {
    # Vidéos d'annonce envoyées en binaire à l'API (150 Mo max côté API) : pas de tampon disque, délais allongés.
    client_max_body_size 160m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /scraping {
    return 301 /scraping/;
}

location /scraping/ {
    proxy_pass http://scraping:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
