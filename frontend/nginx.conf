server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # $uri/index.html : pages pré-rendues au build — documents légaux (dist/legal/<slug>/index.html)
    # et tarifs (dist/pricing/index.html) ; l'accueil pré-rendu est dist/index.html lui-même.
    try_files $uri $uri/index.html /index.html;
    # HTML et fichiers publics toujours revalidés : sinon le navigateur garde l'ancien index après un
    # déploiement et charge des chunks qui n'existent plus.
    add_header Cache-Control "no-cache" always;
  }

  # Manifeste PWA : l'extension .webmanifest n'est pas dans mime.types (servi sinon en octet-stream).
  location = /assets/favicon/site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # Fichiers fingerprintés par Vite (nom-<hash 8 caractères>.ext) : immuables. Les fichiers de public/
  # servis sous /assets/ (polices, images, favicons) n'ont pas de hash et restent revalidés.
  location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
