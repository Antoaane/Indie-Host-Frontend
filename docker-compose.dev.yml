services:
  preflight:
    environment:
      STRICT_EXTERNAL_CONFIG: "false"

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile.dev
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -x "./node_modules/.bin/tsx" ] || [ ! -x "./node_modules/.bin/prisma" ]; then
          npm ci
        fi
        if [ -z "$${DATABASE_URL:-}" ] && [ -n "$${DATABASE_URL_FILE:-}" ] && [ -f "$$DATABASE_URL_FILE" ]; then
          export DATABASE_URL="$$(cat "$$DATABASE_URL_FILE")"
        fi
        if [ -z "$${DATABASE_URL:-}" ]; then
          echo "DATABASE_URL (or DATABASE_URL_FILE) is required" >&2
          exit 1
        fi
        npm run prisma:generate
        npm run prisma:push
        npm run dev
    volumes:
      - ./backend/api:/app
      - api_node_modules:/app/node_modules
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:4000}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-300}
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5179"
      - --strictPort
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5179"
    ports:
      - "5179:5179"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5179').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  nginx:
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/no-templates
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/no-confd
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  api_node_modules:
  frontend_node_modules:
